<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <script>
    try {
      const root = document.documentElement;
      const savedTheme = localStorage.getItem("spasre-theme");
      if (savedTheme === "light" || savedTheme === "dark") {
        root.dataset.theme = savedTheme;
        document.querySelector('meta[name="theme-color"]').content =
          savedTheme === "dark" ? "#121620" : "#f6f7fb";
      }
      // 密度 / 字号也先落好，免得刷新时闪一下
      const look = JSON.parse(localStorage.getItem("spasre-look") || "null") || {};
      if (look.density === "compact") root.dataset.density = "compact";
      if (look.font === "small" || look.font === "large") root.dataset.font = look.font;
    } catch (error) {
      console.warn("Unable to read the saved appearance preferences.", error);
    }
  </script>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="description" content="长期目标：把一条长期计划拆成文本大纲和学习路线图，按拓扑序排成每天的任务。">
  <title>目标 — 任务板</title>
</head>
<body>
  <canvas id="petals" aria-hidden="true"></canvas>
  <div class="page">
    <header class="site-header">
      <a class="wordmark" href="index.html" aria-label="任务板，返回首页">
        <span class="mark" aria-hidden="true">s</span>
        <span>任务板</span>
      </a>
      <div class="header-tools">
        <nav class="nav" aria-label="主导航">
          <a href="index.html">首页</a>
          <a href="tasks.html">任务</a>
          <a href="goals.html" aria-current="page">目标</a>
          <a href="settings.html">设置</a>
        </nav>
        <div class="header-actions">
          <button class="theme-toggle" type="button" aria-label="切换夜间模式" aria-pressed="false" title="切换夜间模式">
            <svg class="auto-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.7"/>
              <path d="M12 3.8a8.2 8.2 0 0 1 0 16.4Z" fill="currentColor"/>
            </svg>
            <svg class="moon-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">              <path d="M20.1 15.2A8.5 8.5 0 0 1 8.8 3.9 8.6 8.6 0 1 0 20.1 15.2Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="m17.5 4 .5 1.5 1.5.5-1.5.5-.5 1.5-.5-1.5-1.5-.5 1.5-.5.5-1.5Z" fill="currentColor"/>
            </svg>
            <svg class="sun-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" hidden>
              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7"/>
              <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </header>
    <main id="top">
      <section class="page-bar">
        <h1>目标</h1>
      </section>

      <section class="section" id="goal-board" aria-label="目标">
        <datalist id="goal-category-options"></datalist>

        <p class="task-agent-status" id="goal-status" role="status"></p>
        <p class="task-hint" id="goal-summary"></p>
        <div id="goal-list"></div>
      </section>
    </main>
    <footer class="site-footer">
      <span class="footer-mascot" aria-hidden="true"><img src="assets/images/mascot/spin.webp" alt="" width="160" height="160" loading="lazy" decoding="async"></span>
      <span>© spasre</span>
    </footer>
  </div>
  <button class="fab" type="button" id="fab-new-goal" aria-label="新建目标" title="新建目标">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  </button>
  <div class="sheet" id="goal-sheet" hidden>
    <div class="sheet-panel sheet-wide" role="dialog" aria-modal="true" aria-labelledby="goal-sheet-title">
      <div class="sheet-head">
        <h2 class="sheet-title" id="goal-sheet-title">新建目标</h2>
        <button class="sheet-close" type="button" data-sheet-close="goal-sheet" aria-label="关闭">✕</button>
      </div>

      <ol class="wizard-steps" id="wz-steps">
        <li class="is-active" data-step="1">目标</li>
        <li data-step="2">完成时间</li>
        <li data-step="3">大纲</li>
        <li data-step="4">每日任务</li>
      </ol>

      <div class="wizard-body">
        <section class="wizard-step" data-step="1">
          <label class="task-field task-field-wide">
            <span>学习目标</span>
            <input class="task-input" type="text" id="wz-title" placeholder="例如：学会写 LLVM 优化 pass">
          </label>
          <label class="task-field task-field-wide">
            <span>补充说明</span>
            <input class="task-input" type="text" id="wz-detail" placeholder="可选">
          </label>
        </section>

        <section class="wizard-step" data-step="2" hidden>
          <div class="task-panel-grid">
            <label class="task-field">
              <span>预期完成</span>
              <input class="task-input" type="date" id="wz-deadline">
            </label>
            <label class="task-field">
              <span>每周投入（小时）</span>
              <input class="task-input" type="number" id="wz-weekly" min="1" max="60" step="1" value="7">
            </label>
          </div>
        </section>

        <section class="wizard-step" data-step="3" hidden>
          <p class="task-hint" id="wz-status"></p>
          <div id="wz-outline"></div>
          <div class="diagram-box" id="wz-diagram-box" hidden></div>
          <ul class="node-editor" id="wz-nodes"></ul>
        </section>

        <section class="wizard-step" data-step="4" hidden>
          <p class="wizard-summary" id="wz-summary"></p>
          <div id="wz-preview"></div>
        </section>
      </div>

      <div class="sheet-foot">
        <button class="task-action" type="button" id="wz-back">上一步</button>
        <button class="task-submit" type="button" id="wz-next">下一步</button>
      </div>
    </div>
  </div>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/interest-lib.js"></script>
  <script src="assets/js/tasks.js"></script>
  <script src="assets/js/goals.js"></script>
  <script src="assets/js/backend.js"></script>
  <script src="assets/js/onboard.js"></script>
</body>
</html>
